<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan Harian</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--mut:#6b7385;--line:#e4e7ee;--in:#16a34a;--out:#dc2626;--acc:#2563eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2028;--text:#eceff5;--mut:#9aa3b5;--line:#2c3340;--in:#4ade80;--out:#f87171;--acc:#60a5fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2028;--text:#eceff5;--mut:#9aa3b5;--line:#2c3340;--in:#4ade80;--out:#f87171;--acc:#60a5fa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.sum .full{grid-column:1/-1}
.sum small{color:var(--mut);display:block;font-size:.75rem}
.sum b{font-size:1.05rem}
.in{color:var(--in)}.out{color:var(--out)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font-size:.95rem}
.seg button.on.i{background:var(--in);color:#fff;border-color:var(--in)}
.seg button.on.o{background:var(--out);color:#fff;border-color:var(--out)}
label{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:1rem}
.add{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:1rem;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{color:var(--mut)}
.del{border:0;background:none;color:var(--mut);font-size:1.1rem;padding:6px}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.bar{display:flex;gap:8px;margin-bottom:8px}
.bar button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<main>
<h1>💰 Catatan Keuangan</h1>
<div class="bar"><input type="month" id="bulan" aria-label="Bulan"><button id="exp">CSV</button></div>
<div class="sum">
  <div><small>Pemasukan</small><b class="in" id="tin">Rp0</b></div>
  <div><small>Pengeluaran</small><b class="out" id="tout">Rp0</b></div>
  <div class="full"><small>Saldo bulan ini</small><b id="tsal">Rp0</b></div>
</div>
<div class="card" style="margin-top:12px">
  <div class="seg">
    <button class="o on" id="bo" type="button">Pengeluaran</button>
    <button class="i" id="bi" type="button">Pemasukan</button>
  </div>
  <label for="jml">Jumlah (Rp)</label>
  <input id="jml" type="number" inputmode="numeric" min="0" placeholder="25000">
  <label for="kat">Kategori</label>
  <select id="kat"></select>
  <label for="ket">Keterangan (opsional)</label>
  <input id="ket" type="text" placeholder="Makan siang">
  <label for="tgl">Tanggal</label>
  <input id="tgl" type="date">
  <button class="add" id="simpan" type="button">Simpan</button>
</div>
<div class="card" id="list"></div>
</main>
<script>
(function(){
var KEY="catatan-keuangan-v1",data=[],jenis="out";
var CAT={out:["Makan","Transport","Belanja","Tagihan","Hiburan","Kesehatan","Lainnya"],in:["Gaji","Bonus","Usaha","Lainnya"]};
var $=function(i){return document.getElementById(i)};
function load(){try{var r=localStorage.getItem(KEY);data=r?JSON.parse(r):[]}catch(e){data=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID")}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function cats(){$("kat").innerHTML=CAT[jenis].map(function(c){return "<option>"+c+"</option>"}).join("")}
function setJenis(j){jenis=j;$("bo").className="o"+(j=="out"?" on":"");$("bi").className="i"+(j=="in"?" on":"");cats()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var b=$("bulan").value,rows=data.filter(function(x){return x.t.slice(0,7)===b}).sort(function(a,c){return c.t.localeCompare(a.t)||c.id-a.id});
  var i=0,o=0;rows.forEach(function(x){x.j=="in"?i+=x.n:o+=x.n});
  $("tin").textContent=rp(i);$("tout").textContent=rp(o);
  var s=$("tsal");s.textContent=rp(i-o);s.className=i-o>=0?"in":"out";
  $("list").innerHTML=rows.length?rows.map(function(x){
    var d=new Date(x.t+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"});
    return '<div class="row"><div><b>'+esc(x.k)+'</b> <small>'+esc(x.d?"· "+x.d:"")+'</small><br><small>'+d+'</small></div><div><span class="'+x.j+'">'+(x.j=="in"?"+":"−")+rp(x.n)+'</span><button class="del" data-id="'+x.id+'" aria-label="Hapus">✕</button></div></div>'
  }).join(""):'<div class="empty">Belum ada catatan bulan ini</div>';
}
$("bo").onclick=function(){setJenis("out")};
$("bi").onclick=function(){setJenis("in")};
$("simpan").onclick=function(){
  var n=parseFloat($("jml").value);
  if(!n||n<=0){$("jml").focus();return}
  var t=$("tgl").value||today();
  data.push({id:Date.now(),j:jenis,n:n,k:$("kat").value,d:$("ket").value.trim(),t:t});
  save();$("jml").value="";$("ket").value="";
  $("bulan").value=t.slice(0,7);render();
};
$("list").onclick=function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-id");
  if(id&&confirm("Hapus catatan ini?")){data=data.filter(function(x){return String(x.id)!==id});save();render()}
};
$("bulan").onchange=render;
$("exp").onclick=function(){
  var csv="Tanggal,Jenis,Kategori,Keterangan,Jumlah\n"+data.map(function(x){return [x.t,x.j=="in"?"Pemasukan":"Pengeluaran",x.k,'"'+x.d.replace(/"/g,'""')+'"',x.n].join(",")}).join("\n");
  var w=window.open("","_blank");if(w){w.document.write("<pre>"+esc(csv)+"</pre>")}
};
load();$("tgl").value=today();$("bulan").value=today().slice(0,7);setJenis("out");render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
